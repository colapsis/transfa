[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "transfa"
version = "0.1.0"
description = "Ephemeral file transfer for AI agents and developers — upload a file, get a shareable link that expires."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
keywords = [
    "file-sharing", "file-transfer", "ai", "agents", "mcp",
    "ephemeral", "upload", "download", "sha256", "ttl",
    "cicd", "pipeline", "artifacts", "ml", "llm", "asyncio",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.24.0"]

[project.urls]
Homepage = "https://transfa.sh"
Documentation = "https://transfa.sh/docs"
Source = "https://github.com/colapsis/transfa"
Tracker = "https://github.com/colapsis/transfa/issues"

[tool.hatch.build.targets.wheel]
packages = ["transfa"]
